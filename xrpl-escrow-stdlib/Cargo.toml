[package]
name = "xrpl-escrow-stdlib"
version = "0.1.0"
edition = "2024"
description = "Smart Escrow types, entry-point context, and host-function wrappers for XRPL WebAssembly contracts"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/ripple/xrpl-wasm-stdlib"
readme = "README.md"
keywords = ["xrpl", "xrp", "wasm", "blockchain", "web3"]
categories = ["no-std", "embedded", "cryptography::cryptocurrencies"]
include = ["src/", "README.md"]

[lib]
crate-type = ["lib"]

[dependencies]
# Both keys are required, and each applies at a different time. Local builds use `path`, so an edit
# in ../xrpl-common-stdlib takes effect immediately. `cargo publish` swaps in `version` instead,
# because a crate on crates.io cannot point at a directory on the author's machine. Keep `version`
# equal to xrpl-common-stdlib's own version; omitting it fails packaging with "all dependencies must
# have a version specified".
xrpl-common-stdlib = { version = "0.8.0", path = "../xrpl-common-stdlib" }

[dev-dependencies]
xrpl-common-stdlib = { path = "../xrpl-common-stdlib", features = ["test-host-bindings"] }
xrpl-stdlib-test-utils = { path = "../xrpl-stdlib-test-utils" }
mockall = "0.15.0"
trybuild = "1"
