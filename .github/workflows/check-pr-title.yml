name: Check PR title

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - "release-*"
      - "release/*"
      - "staging/*"

permissions:
  contents: read

jobs:
  check_title:
    if: ${{ github.event.pull_request.draft != true }}
    uses: XRPLF/actions/.github/workflows/check-pr-title.yml@d7c65e49225a38f6d8010eacf017bb5a98d7476c
    with:
      task_types: '["build", "feat", "fix", "docs", "test", "ci", "style", "refactor", "perf", "chore", "release", "example"]'
